<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Venus Enterprise Platform</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .card { background-color: #1e293b; padding: 2rem; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; }
        a.btn { display: inline-block; background-color: #0284c7; color: white; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1 th:text="${title}">Venus Platform</h1>
        <p th:text="${subtitle}">Dual UI Enterprise Framework</p>
        <hr style="border-color: #334155;">
        <p>Welcome to the Thymeleaf public landing view. For interactive dashboards, access the Vaadin interface below:</p>
        <a href="/dashboard" class="btn">Go to Vaadin Dashboard</a>
    </div>
</body>
</html>
