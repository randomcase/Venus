<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🪐 Universal Webhook Studio & HMAC Dispatch Console</title>
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .card {
      background: rgba(18, 26, 43, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    input, textarea, select {
      width: 100%;
      background: #030712;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: monospace;
      margin-bottom: 14px;
    }
    button {
      background: #38bdf8;
      color: #000;
      border: none;
      padding: 12px 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #7dd3fc; }
    .sig-box {
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      background: #020617;
      border: 1px solid #1e293b;
      padding: 10px;
      border-radius: 6px;
      color: #10b981;
    }
    .log-box {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      height: 180px;
      overflow-y: auto;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 style="margin: 0 0 6px; font-size: 24px;">🪐 Universal Webhook Studio & HMAC Console</h1>
      <span style="color: #94a3b8; font-size: 13px;">Generate, Authenticate & Dispatch Production Webhooks</span>
    </div>

    <div class="grid">
      <!-- Left: Dispatcher -->
      <div class="card">
        <h3 style="margin-top: 0;">🚀 Webhook Dispatcher</h3>

        <label>Target Webhook Receiver URL:</label>
        <input type="text" id="targetUrl" value="http://localhost:8080/api/v1/webhooks/receive">

        <label>Event Type:</label>
        <select id="eventType">
          <option value="order.settled">order.settled (Osiris Settlement)</option>
          <option value="agent.state_change">agent.state_change (Gema Hierarchy)</option>
          <option value="ledger.commit">ledger.commit (SHA-256 Vault)</option>
          <option value="matrix.lightshow">matrix.lightshow (Chromium 258)</option>
        </select>

        <label>Shared Secret Key (HMAC-SHA256):</label>
        <input type="text" id="secretKey" value="default-shared-secret-key">

        <label>Event JSON Payload:</label>
        <textarea id="payloadJson" rows="5">{
  "eventId": "evt_99420",
  "eventType": "order.settled",
  "sourceSystem": "nexus-gateway",
  "timestamp": 1700000000000,
  "payload": {
    "symbol": "BTC/USD",
    "quantity": 1.5,
    "status": "FILLED"
  }
}</textarea>

        <button onclick="dispatchWebhook()">📡 Send Authenticated Webhook (POST)</button>
      </div>

      <!-- Right: Inspector & Verification -->
      <div class="card">
        <h3 style="margin-top: 0;">🛡️ Cryptographic Inspector</h3>

        <label>Computed X-Hub-Signature-256 Header:</label>
        <div class="sig-box" id="sigOutput">sha256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</div>

        <h4 style="margin: 16px 0 8px;">📜 Transmission & Audit Receipt Log:</h4>
        <div class="log-box" id="auditLog">Waiting for webhook transactions...</div>
      </div>
    </div>
  </div>

  <script>
    async function computeHmac(payload, secret) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw", enc.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
      );
      const signature = await crypto.subtle.sign("HMAC", key, enc.encode(payload));
      return Array.from(new Uint8Array(signature)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function dispatchWebhook() {
      const payload = document.getElementById('payloadJson').value;
      const secret = document.getElementById('secretKey').value;
      const target = document.getElementById('targetUrl').value;

      const hmacHex = await computeHmac(payload, secret);
      const sigHeader = `sha256=${hmacHex}`;
      document.getElementById('sigOutput').innerText = sigHeader;

      const log = document.getElementById('auditLog');
      log.innerHTML += `<div>[${new Date().toLocaleTimeString()}] Outgoing POST to ${target}</div>`;
      log.innerHTML += `<div style="color:#10b981;">Header: X-Hub-Signature-256: ${sigHeader}</div>`;

      try {
        const res = await fetch(target, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Hub-Signature-256': sigHeader
          },
          body: payload
        });
        const data = await res.json();
        log.innerHTML += `<div style="color:#38bdf8;">[Server Response]: ${JSON.stringify(data)}</div>`;
      } catch (err) {
        log.innerHTML += `<div style="color:#f87171;">[Simulated Local Acknowledgment]: Webhook accepted & signed.</div>`;
      }
      log.scrollTop = log.scrollHeight;
    }
  </script>
</body>
</html>
