fraction has to come out of"},{"page":"ecosystem.html","what":"the twelve orders, and the two agents nothing requires"},{"page":"mycelium.html","what":"the living fraction, and what it does once it is there"}],"see":["the-gravity-ledger","the-exchange-rate","hydrogen","the-minimum-cycle","the-bag"]},{"id":"the-bag","class":"concept","settled":"working","term":"Fish in a bag","short":"A sealed platform has no outside. Nothing enters, nothing leaves, and every ecological analogue drawn from an open system quietly assumes one.","body":["A goldfish in a bag has a fixed amount of everything. It does not get new water. Its waste does not go anywhere. Whatever was in the bag at the start is what there is, rearranged.","A 9,000 square mile deck at 55 km is a bag. There is no sea to feed in, no watershed draining in from upstream, no dust blowing off a continent, no migratory anything arriving with a gut full of somewhere else. Every terrestrial ecosystem anybody would reason from has all four of those and does not mention them, because on Earth an outside is not a feature, it is the condition.","SO THE FAILURE MODE IS NOT SHORTAGE, IT IS IMMOBILISATION. In a closed system the nutrients do not run out — they get locked into forms nothing available can use. Phosphorus into recalcitrant organic matter, nitrogen into lignin, carbon into wood that nothing on the platform can decompose at the rate it is being made. The bag stays full and the fish still starves.","WHICH REASSIGNS THE ANIMALS. On an open system, colonial waterbirds are a nutrient PUMP — they feed in one place and deposit in another, and the whole point is that the two places are different. In a bag there is only one place. Animals there are TURNOVER: they eat matter that is locking up, excrete it in a labile form something else can take, and keep the cycling rate high enough that the standing stock does not become the sequestered stock. That is a real and necessary job and it is not the job anybody assigns them.","AND IT SETS A DIFFERENT DESIGN QUESTION. The question is not 'what do we bring in' — after the inoculum, almost nothing. It is 'what is the residence time of a phosphorus atom', and the answer had better be years rather than centuries. A bag with slow turnover is a peat bog: enormous nutrient stock, almost none of it available, and a system that looks healthy in inventory and is starving in flux."],"test":"Name the outside. Point at where a nutrient enters the system and where one leaves. If you cannot point at either, stop reasoning from open-system analogues — and then stop asking about stock and start asking about residence time, because in a bag the number that kills you is how long an atom stays locked up, not how many of them there are.","evidence":[{"page":"ecosystem.html","what":"twelve orders and what each one does — read as turnover roles rather than as a food web"},{"page":"mycelium.html","what":"the network that moves what is locked up, which in a bag is the whole job"},{"page":"flood.html","what":"the pulse, which is the one mechanism that moves material without needing an outside"},{"page":"terraform.html","what":"the envelope, and the fact that it closes"}],"see":["the-substrate","the-minimum-cycle","fungibility"]},{"id":"cascade-order","term":"Cascade order settles only ties","class":"mechanism","settled":"settled","short":"Origin, then layer, then specificity, then source order. Being written last is worth nothing against a heavier selector.","body":["This cost the repository a real bug and it is kept written down because a rule that loses looks exactly like a rule nobody wrote. A blanket stop rule at the foot of the ecosystem stylesheet — `.eco:not(:has(#fly:checked)) .cap`, specificity (1,3,0) — was intended to override every capability rule, and every capability rule was a compound `:has()` at (2,4,0). It lost to all of them, silently, and nothing on the screen said so.","The fix was not `!important`. Reaching for importance to win a fight you lost on specificity buries the disagreement rather than settling it, and the next reader inherits a stylesheet whose real precedence is invisible. The fix was noticing the CLAIM WAS FALSE: two of those capabilities genuinely do survive losing the clock, so the blanket rule should never have existed. The arithmetic is still nailed to the foot of that stylesheet as a warning.","The general form is worth more than the CSS. When an override does nothing, the two possibilities are that it lost, or that it was never true. Checking which one costs ten seconds and changes what you do next completely."],"test":"Compute both specificities. If yours is lower, you lost on specificity and moving the rule will not help. If yours is higher and it still does nothing, your selector never matched — the tree is not what you think it is.","evidence":[{"page":"ecosystem.html","what":"(1,3,0) against (2,4,0), recorded at the foot of the stylesheet rather than quietly fixed"},{"page":"workbook.html","what":"chapters three and four, with the drill that computes both triples"},{"page":"automat.html","what":"devmode's PROBE, which computes the triple live including :has/:is/:where"}],"see":["the-lookup-table","the-zero-counter","the-query-string"]},{"id":"the-lookup-table","term":"A lookup table is auditable","class":"mechanism","settled":"settled","short":"CSS has no multiplication over state, so you write the products. That is not only a defeat.","body":["When an outcome depends on two or three inputs together, there is no expression available — there is a row per combination, and somebody typed every one. Three inputs by four options is twelve rules. Reading × circuit × hour is twenty-four.","The argument for it: every cell is visible, every cell was a decision, and a reviewer can point at row nine and say THAT ONE IS WRONG without reading any logic. An expression hides its cases; a table cannot. When the table gets long enough to hurt, that is information — it means the model has more state than the thing it models deserves, and the answer is usually to cut an input rather than generate the rows.","Know the ceiling before starting. The cost is the product, not the sum: two axes of three is nine and pleasant, three of four is sixty-four and needs a build step, four of five is six hundred and twenty-five and you should have reduced the model. Past about twenty rows this repository generates them from JSON — the page stays scriptless; the authoring does not have to be.","And check first whether you wanted a count rather than a combination. Half the tables people write by hand were a counter."],"test":"Ask whether the outcome depends on WHICH or on HOW MANY. If how many, it is one counter and no table. If which, count the product before you start typing.","evidence":[{"page":"pulse.html","what":"24 enumerated circuits — reading × circuit × hour × text"},{"page":"bench.html","what":"17 judges × 12 circuits, and the one card with no condition on it"},{"page":"workbook.html","what":"chapter seven, with the ceiling stated in rows"}],"see":["cascade-order","the-zero-counter","the-query-string"]},{"id":"the-zero-counter","term":"The counter that prints zero","class":"mechanism","settled":"settled","short":"Declare it, increment it with nothing, print it. The only way a stylesheet can state a negative.","body":["A sentence saying \"no opinion carries a drafter's name\" is a claim the reader has to take. A counter named `named`, declared on the body, incremented by no rule anywhere in the file, and printed in the tally, is the same claim in a form the reader can watch fail to move while they change every control on the page.","It is used three times in this yard and it is the same instrument each time: `named` on the bench, `gaps` on the quiet storm set, `burn` on the aerostat riding the air. In each case the interesting number is the one that stays at zero under every setting, and the only way to make a zero legible is to give it somewhere to have gone up.","The cost is that a reader must trust the file — a counter incremented nowhere is indistinguishable from a counter someone forgot to wire. Which is why the pages that use it say so in the stylesheet, in the comment next to the declaration, where the person checking is already looking."],"test":"Search the stylesheet for the counter's name. If `counter-increment` mentions it anywhere, the zero is a result; if it does not, the zero is an assertion — and the page should say which.","evidence":[{"page":"bench.html","what":"`named` — 40 disposed, 12 drafted, 0 bearing a drafter, under every setting"},{"page":"rapture.html","what":"`gaps` in a set built out of overlaps"},{"page":"buddha.html","what":"the matter counter reading 1 under both nouns while the capability counter moves"}],"see":["the-attribution-gap","the-lookup-table","cascade-order"]},{"id":"the-query-string","term":"The half of the URL CSS cannot read","class":"mechanism","settled":"settled","short":"CSS reads the fragment through :target. It cannot read the query. Nothing can. So that is where the script layer lives.","body":["A document has exactly one `:target` at a time, and the fragment is the only durable state a scriptless page has — it survives reload, it is in the bookmark, it goes in a message, Back is undo. The query string is the other half of the same address and it is invisible to the style layer completely.","That asymmetry is not a limitation to work around, it is a channel. `automat.js` and `devmode.js` are wired into every page in this yard and are inert unless the address carries `?run` or `?dev`. Open a board plainly and nothing runs and the stylesheet decides everything, exactly as before. Open it with a query and a script is pressing the controls — and the two layers cannot collide, because they read different halves of the same URL.","The claim was never that there is no script file. It was that the logic is the cascade, and that is intact and now checkable from inside the page."],"test":"Open any board without a query string and count the script tags that do anything. Then open it with ?dev and use CENSUS, which counts them for you and says which are inert.","evidence":[{"page":"persist.html","what":"six states, no inputs at all, every control a link — and the query stated as write-only"},{"page":"automat.html","what":"the channel, and 45 boards driven through it"},{"page":"workbook.html","what":"chapter eight, and the honest answer to wanting two independent durable axes"}],"see":["the-orbit","cascade-order","decentralization"]},{"id":"the-orbit","term":"The orbit","class":"number","settled":"settled","short":"lcm over the tribes of (period × steps). The beats before a board is in an arrangement it has held before.","body":["It is the honest measure of an endless thing, and it is computed in two places independently — in the HUD at runtime and in the generator that builds the wall — rather than asserted in either.","It matters because \"endless\" is cheap to claim. A run whose components all move on period 1 only ever visits the diagonal of its state space and returns to the start almost immediately; it looks endless and is a short loop. Coprime periods make the combined orbit the lcm, which for a board with a sixteen-checkbox bank leaves the safe integers early enough that the arithmetic has to be done in BigInt.","So the number is a claim you can check about a property you would otherwise have to take on faith, which is the same move as the zero counter and the printed division."],"test":"Set every period to 1 and compute the orbit again. If a system's endlessness survives that, it was structural; if the orbit collapses to the number of steps in one component, the endlessness was the cadences and not the design.","evidence":[{"page":"automat.html","what":"an orbit on every tile, computed from the board's own controls"},{"page":"rapture.html","what":"a set with no last record and a superrotation with no last lap"},{"page":"clans.html","what":"six cadences chosen pairwise coprime, so the lcm is their product and the board does not repeat for 30,030 firings — the orbit as a design decision rather than an observation"}],"see":["decentralization","caught-up"]},{"id":"syndication","term":"Syndication","class":"concept","settled":"settled","short":"Two or more, acting as one, sitting where everything has to pass. Not one — one is a monopoly. It taxes the rate, never the stock.","body":["YOU ALONE CANNOT BE A SYNDICATE, and that is not a nicety of usage, it is the whole structure. A single party whose removal disconnects two others is a cut vertex, and a cut vertex is a monopoly or a bottleneck. A syndicate is a COMBINATION: a set of two or more whose members are individually removable and collectively not. They are a cut SET, and they behave as one.","The consequence is the useful part and it is not obvious. Remove any single member of a syndicate and nothing happens, because the others cover. Which means the standard test for centralisation — delete one component and see whether anything else moves — is STRUCTURALLY BLIND to syndication. It will return a clean result on an arrangement that is entirely captured. To find a syndicate you have to delete combinations, and combinations are where nobody looks because there are so many more of them.","So the procedure has two halves. Find the minimal sets whose removal disconnects: sets where the whole set cuts and no proper subset of it does. Then ask whether the members are CORRELATED — do they price, refuse and time together? A minimal cut set of independent parties is just thin redundancy and it is fine. The same set moving in step is a syndicate, and no member of it has to know that.","NOW THE HALF THAT IS USUALLY GOT WRONG. Syndication is a hindrance and not a loss factor. It acts on the RATE at which you gain and never on the STOCK you already hold. A toll makes the road slower and the journey dearer; it does not reach into the cart. Everything a syndicate can do sits in that sentence — slow you, lengthen your path, price your passage, refuse you a turn — and not one of those subtracts what you already brought.","Which is why a base can run on a law that nothing ever goes down and still take this seriously. The two do not conflict. Being syndicated means climbing at a worse rate than you otherwise would have, forever, and seeing it requires comparing yourself against a counterfactual rather than against yesterday. That is exactly why it is invisible from inside, and it is the second reason to trust the structural test over the felt experience.","A party that takes what you already hold is not a syndicate. That is confiscation: a different mechanism with a different remedy. You can be robbed by somebody holding no position at all, and you can be thoroughly syndicated by people who never take a thing."],"test":"Three ways to break this and they are not equally easy. FIRST, the cheap one: find a genuine syndicate that is a single party. If you can, the combination requirement is wrong and the word means something closer to bottleneck. SECOND: find a minimal cut set of two or more whose members demonstrably do NOT move together — independent pricing, independent refusals, independent timing — and which everybody nonetheless agrees is a syndicate. That would mean correlation is not required and the shape alone is enough. THIRD, and this is the load-bearing one: find a case where the set removes what was already earned rather than slowing what is earned next, and show it is syndication rather than confiscation wearing its coat. If that case stands, the hindrance-not-loss claim is false, and this entry and the +1 law cannot both survive it.","evidence":[{"page":"syndicate.html","what":"six indicators, each a structural fact checkable on paper rather than a vibe — and none of them requires anybody to be villainous or even aware"},{"page":"corps.html","what":"the cut-vertex routine over a command tree names 7 of 20, every node with more than one neighbour — the worked example of what syndication is NOT, since each of those is one party alone"},{"page":"missouri.html","what":"ten sites all closing on one revenue model whose ceiling is set by the road: too much of one thing arrived at by choosing on the wrong number, with nobody combining and nobody at fault"}],"see":["decentralization","fungibility","the-relay","the-gas"]}];
const INBOUND = {"decentralization":6,"fungibility":8,"the-minimum-cycle":6,"the-window":3,"the-passage":4,"the-light-delay":4,"the-relay":9,"the-baton":5,"the-exchange":3,"the-injector":3,"smart-contracts":4,"the-harvest-guarantee":3,"the-wallet":6,"the-ledger":2,"the-gas":4,"the-rename":5,"the-prior-condition":4,"the-retainer":5,"the-attribution-gap":7,"the-constant-judge":3,"caught-up":2,"superrotation":6,"hydrogen":6,"the-exchange-rate":4,"the-gravity-ledger":2,"the-substrate":3,"the-bag":1,"cascade-order":4,"the-lookup-table":2,"the-zero-counter":4,"the-query-string":2,"the-orbit":3,"syndication":0};
const LEANERS = {"decentralization":["fungibility","the-minimum-cycle","the-injector","the-query-string","the-orbit","syndication"],"fungibility":["decentralization","smart-contracts","the-wallet","the-rename","the-prior-condition","hydrogen","the-bag","syndication"],"the-minimum-cycle":["decentralization","superrotation","hydrogen","the-exchange-rate","the-substrate","the-bag"],"the-window":["the-passage","the-relay","hydrogen"],"the-passage":["the-window","the-light-delay","the-relay","superrotation"],"the-light-delay":["the-passage","the-relay","the-injector","superrotation"],"the-relay":["the-window","the-passage","the-light-delay","the-baton","the-exchange","the-injector","caught-up","hydrogen","syndication"],"the-baton":["the-relay","the-exchange","the-injector","hydrogen","the-exchange-rate"],"the-exchange":["the-relay","the-baton","the-attribution-gap"],"the-injector":["the-light-delay","the-relay","the-baton"],"smart-contracts":["the-harvest-guarantee","the-wallet","the-gas","the-rename"],"the-harvest-guarantee":["smart-contracts","the-prior-condition","the-attribution-gap"],"the-wallet":["fungibility","the-baton","smart-contracts","the-harvest-guarantee","the-ledger","the-prior-condition"],"the-ledger":["the-wallet","the-gas"],"the-gas":["the-exchange","the-injector","the-ledger","syndication"],"the-rename":["fungibility","smart-contracts","the-harvest-guarantee","the-prior-condition","the-retainer"],"the-prior-condition":["the-harvest-guarantee","the-wallet","the-rename","the-retainer"],"the-retainer":["the-wallet","the-rename","the-prior-condition","the-attribution-gap","the-constant-judge"],"the-attribution-gap":["the-exchange","the-harvest-guarantee","the-wallet","the-ledger","the-retainer","the-constant-judge","the-zero-counter"],"the-constant-judge":["the-gas","the-retainer","the-attribution-gap"],"caught-up":["superrotation","the-orbit"],"superrotation":["the-window","the-light-delay","caught-up","hydrogen","the-exchange-rate","the-gravity-ledger"],"hydrogen":["the-minimum-cycle","the-baton","superrotation","the-exchange-rate","the-gravity-ledger","the-substrate"],"the-exchange-rate":["the-baton","hydrogen","the-gravity-ledger","the-substrate"],"the-gravity-ledger":["the-exchange-rate","the-substrate"],"the-substrate":["the-minimum-cycle","the-gravity-ledger","the-bag"],"the-bag":["the-substrate"],"cascade-order":["the-constant-judge","the-lookup-table","the-zero-counter","the-query-string"],"the-lookup-table":["cascade-order","the-zero-counter"],"the-zero-counter":["the-ledger","the-attribution-gap","cascade-order","the-lookup-table"],"the-query-string":["cascade-order","the-lookup-table"],"the-orbit":["decentralization","caught-up","the-query-string"],"syndication":[]};
const ORDER = ["the-relay","fungibility","the-attribution-gap","decentralization","hydrogen","superrotation","the-wallet","the-minimum-cycle","the-baton","the-rename","the-retainer","cascade-order","smart-contracts","the-zero-counter","the-exchange-rate","the-gas","the-light-delay","the-passage","the-prior-condition","the-constant-judge","the-exchange","the-harvest-guarantee","the-injector","the-orbit","the-substrate","the-window","the-lookup-table","caught-up","the-gravity-ledger","the-query-string","the-ledger","the-bag","syndication"];
const CLASSES = ["concept","number","mechanism","figure"];

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const by = (id) => ENTRIES.find((e) => e.id === id);

const KEY = 'venus.reading.v1';
let read = {};
try { read = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {} };

let cur = location.hash.slice(1) || ORDER[0];

/* ── the shelf. Ordered by how depended-on, not alphabetically: the base
   already carries a see-also graph and nobody had ever used it to decide
   what should be within reach. ─────────────────────────────────────── */
function shelf() {
  const out = [];
  let band = null;
  ORDER.forEach((id) => {
    const e = by(id), n = INBOUND[id];
    const b = n >= 5 ? 'load-bearing' : n >= 2 ? 'leaned on' : n === 1 ? 'referred to once'
      : 'nothing points here';
    if (b !== band) {
      band = b;
      out.push('<div class="h">' + esc(band) + '<i>' +
        ORDER.filter((x) => {
          const m = INBOUND[x];
          return (m >= 5 ? 'load-bearing' : m >= 2 ? 'leaned on' : m === 1 ?
            'referred to once' : 'nothing points here') === band;
        }).length + '</i></div>');
    }
    out.push('<a data-id="' + id + '" class="' + (id === cur ? 'on ' : '') +
      (read[id] ? 'read' : '') + '"><b>' + esc(e.term) + '</b><s>' +
      '<em>' + esc(e.class) + '</em> \u00b7 <u>' + esc(e.settled) + '</u>' +
      (n ? ' \u00b7 ' + n + ' lean on it' : '') + '</s></a>');
  });
  $('#shelf').innerHTML = out.join('');
  $('#shelf').onclick = (ev) => {
    const a = ev.target.closest('a[data-id]');
    if (a) { cur = a.dataset.id; location.hash = cur; paint(); }
  };
}

/* ── the alcove ────────────────────────────────────────────────────── */
function paint() {
  const e = by(cur);
  if (!e) return;
  const lean = LEANERS[e.id] || [];
  const body = Array.isArray(e.body) ? e.body : [e.body];

  $('#alcove').innerHTML = '<div class="sheet">' +
    '<p class="cls">' + esc(e.class) + '<i class="' + esc(e.settled) + '">' +
      esc(e.settled) + '</i>' +
      (INBOUND[e.id] ? '<i>' + INBOUND[e.id] + ' entries lean on this</i>' : '') + '</p>' +
    '<h2>' + esc(e.term) + '</h2>' +
    '<p class="short">' + esc(e.short) + '</p>' +
    '<div class="body">' + body.map((p) => '<p>' + esc(p) + '</p>').join('') + '</div>' +

    (e.test ? '<div class="test"><h3>the test \u2014 what would show this false</h3>' +
      '<p class="q">' + esc(e.test) + '</p>' +
      '<div class="desk">' +
      '<textarea id="finding" placeholder="What happened when you put it to that? ' +
        'Write it here and it is saved to notes/ \u2014 which means it survives, ' +
        'and it is read.">' + esc(read[e.id] || '') + '</textarea>' +
      '<div class="go"><button id="save">save the finding</button>' +
      '<span id="msg">' + (read[e.id] ? '<b>you have tested this one</b>' : '') +
      '</span></div></div></div>' : '') +

    '<div class="meta">' +
      '<div class="box"><h4>demonstrated on</h4>' +
        ((e.evidence || []).length
          ? '<ul>' + e.evidence.map((v) => '<li><a href="/' + esc(v.page) + '">' +
            esc(v.page) + '</a><em>' + esc(v.what) + '</em></li>').join('') + '</ul>'
          : '<p class="none">Nothing yet. An entry with no board behind it is a ' +
            'claim, not a finding.</p>') + '</div>' +
      '<div class="box"><h4>it points at</h4>' +
        ((e.see || []).length
          ? '<ul>' + e.see.map((t) => by(t)
              ? '<li><a data-go="' + esc(t) + '">' + esc(by(t).term) + '</a></li>'
              : '<li>' + esc(t) + '</li>').join('') + '</ul>'
          : '<p class="none">Nothing.</p>') + '</div>' +
      '<div class="box"><h4>what leans on it</h4>' +
        (lean.length
          ? '<ul>' + lean.map((t) => '<li><a data-go="' + esc(t) + '">' +
            esc(by(t).term) + '</a></li>').join('') + '</ul>'
          : '<p class="none">Nothing points here yet, which is worth knowing: it ' +
            'is either new, or it is not load-bearing.</p>') + '</div>' +
    '</div>' +

    '<footer>Read from kb.json by reading.mjs. The shelf is ordered by how many ' +
    'entries point at each one, which the base already recorded and nothing had ' +
    'used. Findings save to notes/ when the app is running.<br>' +
    '<a href="/kb.html">the base as a document</a> &middot; ' +
    '<a href="/hall.html">the hall</a> &middot; <a href="/dev.html">the hub</a></footer>' +
    '</div>';

  $('#alcove').scrollTop = 0;
  document.querySelectorAll('[data-go]').forEach((a) => {
    a.onclick = () => { cur = a.dataset.go; location.hash = cur; paint(); shelf(); };
  });
  const s = $('#save');
  if (s) s.onclick = saveFinding;
  shelf();
}

async function saveFinding() {
  const e = by(cur);
  const text = $('#finding').value.trim();
  const msg = $('#msg');
  if (!text) { msg.innerHTML = '<i>nothing written</i>'; return; }
  read[e.id] = text; keep(); shelf();
  msg.textContent = 'writing...';
  try {
    const r = await fetch('/api/note', { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        title: 'tested: ' + e.term,
        page: 'reading.html#' + e.id,
        pageTitle: 'The reading room',
        body: 'THE CLAIM\n' + e.short + '\n\nTHE TEST ON FILE\n' + e.test +
              '\n\nWHAT HAPPENED\n' + text
      }) });
    const j = await r.json();
    msg.innerHTML = r.ok ? 'saved to <b>' + j.file + '</b>'
      : '<i>not saved: ' + j.error + '</i>';
  } catch (err) {
    msg.innerHTML = '<i>kept in this browser only \u2014 run venus-app.mjs to ' +
      'write it to disk</i>';
  }
}

addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h && by(h)) { cur = h; paint(); }
});
shelf(); paint();
</script>
