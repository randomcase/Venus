<!--
  THE FIRST BLADE — an idle game with the Tao in mind. One blade of grass
  grows by itself. Everything you let happen compounds; everything you DO
  spends stillness, and the meadow grows slower for it. Wu wei, as a loop.

  The page works three ways from the same files:
    · as a Chromium side panel (manifest.json points here)
    · as a tab inside the extension (Workshop → open in a tab)
    · exported flat, engine + rules + UI inlined, as grass.html in the yard
  The rules are def.json. The engine is engine.js. This file is only the room.
  The same def.json drives the ScalaFX edition in desktop/.
-->

<script>
/* engine.js — Tideline. The rules, with no DOM in them.

   Everything the game knows comes from def.json. This file turns that
   definition into a state machine and exposes it as `Tick`, a small API you
   can drive from the page, the console, the Workshop tab, or a script:

     Tick.load(def, savedState?)   Tick.step(dt)         Tick.tap()
     Tick.buy(machineId, k|'max')  Tick.research(id)     Tick.build(sectorId)
     Tick.setPlan({silver,crew,gear,grain})               Tick.refloat(doctrineId)
     Tick.setPlaystyle(id)         Tick.setAvatar(obj)
     Tick.formDef() Tick.nextForm() Tick.conditions() Tick.canBecome() Tick.become()
     Tick.forestTier() Tick.depthName() Tick.depthNeed(d)
     Tick.state() Tick.def() Tick.mods() Tick.power() Tick.crew() Tick.lift()
     Tick.rates() Tick.light() Tick.cost(m,k) Tick.maxBuy(m) Tick.available(m)
     Tick.catchUp(now) Tick.serialize() Tick.on('log'|'change'|'ship', fn)
     Tick.assemble(files, def) — builds the standalone HTML export.

   Effects are declarative so they can live in JSON:
     {type:'mul', target:'all'|'tap'|'draw'|'lift'|'cargo'|'science'|'storm'|
                          'crewWater'|'crewNeed'|'crewMass'|'researchCost'|
                          'machine:<id>'|'res:<id>', x}
     {type:'add', target:'night', x}      {type:'unlock', id}
   'crewWater' scales every crew upkeep; the name is older than the theme.
*/
(function (root) {
  const T = { version: 2 };
  let D = null, S = null, M = null, flows = {}, handlers = {};
  const byId = (arr, id) => arr.find(x => x.id === id);
  const emit = (e, x) => (handlers[e] || []).forEach(f => f(x));
  T.on = (e, f) => { (handlers[e] = handlers[e] || []).push(f); return T; };
  T.log = (m) => { S.log.unshift({ t: Math.round(S.clock), m }); if (S.log.length > 80) S.log.length = 80; emit('log', m); };
  const defaultAvatar = () => Object.fromEntries((D.avatar ? D.avatar.fields : []).map(f => [f.id, f.default != null ? f.default : f.type === 'range' ? f.min : f.options[0]]));

  T.fresh = () => ({
    v: 2, clock: 0, saved: Date.now(),
    res: Object.fromEntries(D.resources.map(r => [r.id, r.start || 0])),
    total: { [D.primary]: 0, ships: 0 },
    n: Object.fromEntries(D.machines.map(m => [m.id, 0])),
    sectors: D.sectors.filter(s => s.built).map(s => s.id),
    research: [], milestones: [], events: [], log: [],
    ship: { n: 1, t: D.ship.cadence, manifest: null }, plan: { ...D.ship.plan },
    morale: 1, ballast: 0, doctrines: {}, refloats: 0, playstyle: null, avatar: defaultAvatar(), still: D.stillness ? D.stillness.max : 0,
    form: 0, ring: 1, acorns: 0, formsDone: 0, sinceAct: 0, trees: 0, spores: 0, depth: 0, flushT: D.mycelium ? D.mycelium.every : 0,
  });
  const migrate = (s) => { const f = T.fresh(); const o = Object.assign({}, f, s);
    o.res = Object.assign({}, f.res, s.res || {}); o.n = Object.assign({}, f.n, s.n || {});
    o.avatar = Object.assign({}, f.avatar, s.avatar || {}); for (const k of Object.keys(o.avatar)) if (!(k in f.avatar)) delete o.avatar[k]; return o; };

  T.load = (def, state) => { D = def; S = state ? migrate(typeof state === 'string' ? JSON.parse(state) : state) : T.fresh(); recompute(); return T; };
  T.def = () => D; T.state = () => S; T.mods = () => M; T.flows = () => flows;
  T.serialize = () => { S.saved = Date.now(); return JSON.stringify(S); };

  /* ---------------------------------------------------------------- mods */
  const base = () => ({ all: 1, tap: 1, draw: 1, night: 0, cargo: 1, lift: 1, liftBase: 0, science: 1, storm: 1, stillness: 1, decay: 1, cap: 1,
    crewWater: 1, crewNeed: 1, crewMass: 1, researchCost: 1, machine: {}, res: {}, unlock: {} });
  function apply(e, soft = 1) {
    if (e.type === 'unlock') { M.unlock[e.id] = true; return; }
    const [k, id] = e.target.split(':');
    if (e.type === 'add') { M[k] = (M[k] || 0) + e.x; return; }
    const x = soft === 1 ? e.x : 1 + (e.x - 1) * soft;
    if (id) M[k][id] = (M[k][id] || 1) * x; else M[k] = (M[k] || 1) * x;
  }
  function recompute() {
    M = base();
    const ps = S.playstyle && byId(D.playstyles || [], S.playstyle); if (ps) ps.effects.forEach(e => apply(e));
    const se = T.season(); if (se) (se.effects || []).forEach(e => apply(e));
    const fd = T.formDef(); if (fd) (fd.effects || []).forEach(e => apply(e));
    if (D.becoming) M.all *= 1 + D.becoming.perForm * S.formsDone + D.becoming.perRing * (S.ring - 1);
    if (D.forest) { M.all *= 1 + D.forest.perTree * S.trees + D.forest.tierBonus * T.forestTier().index; M.liftBase += D.forest.ground * S.trees; }
    if (D.mycelium) M.all *= 1 + D.mycelium.perLevel * S.depth;
    D.sectors.forEach(s => S.sectors.includes(s.id) && (s.effects || []).forEach(e => apply(e)));
    D.research.forEach(r => S.research.includes(r.id) && (r.effects || []).forEach(e => apply(e)));
    D.milestones.forEach(m => S.milestones.includes(m.id) && (m.effects || []).forEach(e => apply(e)));
    for (const [d, lv] of Object.entries(S.doctrines)) { const doc = byId(D.prestige.doctrines, d); if (doc) for (let i = 0; i < lv; i++) doc.effects.forEach(e => apply(e)); }
    M.all *= 1 + D.prestige.perPoint * S.ballast;
    S.events.forEach(ev => { const d = byId(D.events, ev.id); d && d.effects.forEach(e => apply(e, M.storm)); });
    emit('change');
  }
  const mm = id => M.machine[id] || 1, rm = id => M.res[id] || 1;

  /* --------------------------------------------------------------- world */
  T.phase = () => (S.clock % D.day.length) / D.day.length;
  T.isDay = () => T.phase() < 1 - D.day.night;
  T.light = () => T.isDay() ? 1 : Math.min(1, M.night);
  T.power = (light = T.light()) => {
    let sup = 0, dem = 0;
    for (const m of D.machines) { const n = S.n[m.id]; if (!n) continue;
      if (m.out && m.out.power) { let p = m.out.power * n * mm(m.id) * M.all; if (m.solar) p *= light; if (m.night) p *= light < 1 ? 1 : 0; sup += p; }
      dem += (m.draw || 0) * n * M.draw; }
    return { sup, dem, eff: dem > 0 ? Math.min(1, sup / dem) : 1 };
  };
  T.crew = () => { const need = D.machines.reduce((a, m) => a + (m.crew || 0) * S.n[m.id], 0) * M.crewNeed;
    return { need, have: S.res.crew, eff: need > 0 ? Math.min(1, S.res.crew / need) : 1 }; };
  T.lift = () => ({
    cap: (D.lift.base + M.liftBase + D.machines.reduce((a, m) => a + (m.lift || 0) * S.n[m.id], 0)) * M.lift,
    used: D.machines.reduce((a, m) => a + (m.mass || 0) * S.n[m.id], 0) + S.res.crew * D.lift.crewMass });
  T.available = m => S.sectors.includes(m.sector) && (!m.requires || M.unlock[m.requires]) && (!m.needsMachine || S.n[m.needsMachine.id] >= m.needsMachine.n);
  T.cap = r => { const d = byId(D.resources, r); if (!d || d.cap == null) return Infinity;
    return (d.cap + D.machines.reduce((a, m) => a + ((m.store || {})[r] || 0) * S.n[m.id], 0)) * M.cap; };
  const seasonIdx = () => D.seasons ? Math.floor(S.clock / D.seasons.length) % D.seasons.list.length : -1;
  T.season = () => D.seasons ? D.seasons.list[seasonIdx()] : null;

  /* ---------------------------------------------------------------- buying */
  T.cost = (m, k = 1) => { const g = m.growth || D.growth, n = S.n[m.id], out = {};
    for (const [r, c] of Object.entries(m.cost)) out[r] = Math.ceil(c * Math.pow(g, n) * (Math.pow(g, k) - 1) / (g - 1)); return out; };
  T.can = cost => Object.entries(cost).every(([r, c]) => (S.res[r] || 0) >= c);
  const pay = cost => Object.entries(cost).forEach(([r, c]) => { S.res[r] -= c; });
  T.maxBuy = m => { const L = T.lift(); let lo = 0, hi = 1000;
    const ok = k => T.can(T.cost(m, k)) && L.used + (m.mass || 0) * k <= L.cap;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ok(mid)) lo = mid; else hi = mid - 1; } return lo; };
  T.buy = (id, k = 1) => { const m = byId(D.machines, id); if (!m || !T.available(m)) return false;
    if (k === 'max') k = T.maxBuy(m); if (k < 1) return false;
    const c = T.cost(m, k); if (!T.can(c)) return false;
    const L = T.lift(); if (L.used + (m.mass || 0) * k > L.cap) { T.log(`No ${D.lift.name} for that. Open more.`); return false; }
    pay(c); S.n[id] += k; emit('change'); return true; };
  T.researchCost = r => Math.ceil(r.cost * M.researchCost);
  T.research = id => { const r = byId(D.research, id); if (!r || S.research.includes(id)) return false;
    if ((r.needs || []).some(x => !S.research.includes(x)) || (r.excludes || []).some(x => S.research.includes(x))) return false;
    const c = T.researchCost(r); if (S.res.science < c) return false;
    S.res.science -= c; S.research.push(id); T.log(`${r.name}: ${r.desc}.`); recompute(); return true; };
  T.sectorOk = s => !S.sectors.includes(s.id) && (s.needs || []).every(x => S.sectors.includes(x));
  T.build = id => { const s = byId(D.sectors, id); if (!s || !T.sectorOk(s)) return false;
    const c = { ...s.cost }; const crew = c.crew || 0; delete c.crew;
    if (S.res.crew < crew || !T.can(c)) return false;
    pay(c); S.sectors.push(id); T.log(`${s.name} (${s.role}) reached.`); recompute(); return true; };
  T.calm = () => D.stillness ? D.stillness.floor + (1 - D.stillness.floor) * S.still / D.stillness.max : 1;
  T.tap = () => { const v = D.tap * M.tap * M.all; S.res[D.primary] += v; S.total[D.primary] += v; S.sinceAct = 0; if (D.stillness) S.still = Math.max(0, S.still - D.stillness.tapCost); return v; };
  const keys = () => Object.keys(D.ship.plan);
  const norm = p => { const t = keys().reduce((a, k) => a + Math.max(0, p[k] || 0), 0) || 1;
    return Object.fromEntries(keys().map(k => [k, Math.max(0, p[k] || 0) / t])); };
  T.setPlan = p => { S.plan = norm(p); return S.plan; };
  T.setPlaystyle = id => { if (S.playstyle || !byId(D.playstyles || [], id)) return false; S.playstyle = id; T.log(`Playstyle: ${byId(D.playstyles, id).name}.`); recompute(); return true; };
  T.setAvatar = a => { Object.assign(S.avatar, a); emit('change'); return S.avatar; };
  T.canRefloat = () => S.sectors.includes(D.prestige.requires) && S.total[D.primary] >= D.prestige.min;
  T.refloatPoints = () => Math.floor(Math.sqrt(S.total[D.primary] / D.prestige.min));
  T.refloat = doc => { if (!T.canRefloat() || !byId(D.prestige.doctrines, doc)) return false;
    const keep = { ballast: S.ballast + T.refloatPoints(), doctrines: { ...S.doctrines, [doc]: (S.doctrines[doc] || 0) + 1 }, refloats: S.refloats + 1, log: S.log, avatar: S.avatar,
      ring: S.ring, acorns: S.acorns, formsDone: S.formsDone, trees: S.trees, spores: S.spores, depth: S.depth, sinceAct: S.sinceAct, flushT: S.flushT };
    S = Object.assign(T.fresh(), keep); recompute();
    T.log(`${D.prestige.name}: reputation ${S.ballast}, rule ${doc}. Everything ×${(1 + D.prestige.perPoint * S.ballast).toFixed(1)} for good.`); return true; };

  /* -------------------------------------------------------------- becoming
     The transformation of things. Three tracks that do not end:
       forms and rings  — what your blade is; ring 1 is scripted, the rest generated
       the forest       — one tree per ring closed, never reset, never lost
       the mycelium     — under everything; fed by rot and by tribute; depth on a log scale */
  const h32 = (a, b, c) => { let x = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791)) | 0; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return x >>> 0; };
  const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
  T.formsPerRing = (r = S.ring) => !D.becoming ? 0 : r === 1 ? D.becoming.forms.length : D.becoming.generator.formsPerRing;
  T.formDef = (r = S.ring, k = S.form) => { const B = D.becoming; if (!B) return null; if (r === 1) return B.forms[Math.min(k, B.forms.length - 1)];
    const g = B.generator, hn = h32(B.seed, r, k * 3 + 1), hp = h32(B.seed, r, k * 3 + 2), hs = h32(B.seed, r, k * 3 + 3);
    const plant = hp % g.names.plant.length, pas = g.passives[hs % g.passives.length];
    const when = { total: { [D.primary]: g.threshold.base * Math.pow(g.threshold.perForm, k) * Math.pow(g.threshold.perRing, r - 1) } };
    if (g.twist && k % g.twist.every === 0) when.stillDays = g.twist.stillDays * r;
    return { id: `r${r}f${k}`, name: g.names.first[hn % g.names.first.length] + ' ' + g.names.plant[plant], shape: g.shapes[plant % g.shapes.length], effects: pas.effects, text: pas.text, when }; };
  T.nextForm = () => S.form + 1 < T.formsPerRing() ? T.formDef(S.ring, S.form + 1) : T.formDef(S.ring + 1, 0);
  T.conditions = (fd = T.formDef()) => { if (!fd || !fd.when) return []; const out = [], w = fd.when, rn = id => (byId(D.resources, id) || { name: id }).name;
    for (const [res, v] of Object.entries(w.total || {})) out.push({ label: `${rn(res)}, all time`, have: S.total[res] || 0, need: v });
    for (const [res, v] of Object.entries(w.res || {})) out.push({ label: `${rn(res)} in hand`, have: S.res[res] || 0, need: v });
    for (const [id, v] of Object.entries(w.n || {})) out.push({ label: (byId(D.machines, id) || { name: id }).name, have: S.n[id] || 0, need: v });
    if (w.sectors != null) out.push({ label: 'chapters', have: S.sectors.length, need: w.sectors === 'all' ? D.sectors.length : w.sectors });
    if (w.stillDays != null) out.push({ label: 'days without acting', have: S.sinceAct, need: w.stillDays });
    out.forEach(c => { c.ok = c.have >= c.need; }); return out; };
  T.canBecome = () => !!D.becoming && T.conditions().every(c => c.ok);
  T.become = () => { if (!T.canBecome()) return false; const was = T.formDef(); S.form++; S.formsDone++;
    if (S.form >= T.formsPerRing()) { S.ring++; S.form = 0; S.acorns++; S.trees++; T.log(`${cap1(was.name)} dropped an acorn. Ring ${S.ring - 1} closed and a tree stands. Ring ${S.ring} begins as ${T.formDef().name}.`); }
    else { const now = T.formDef(); T.log(`${cap1(was.name)} became ${now.name}.${now.text ? ' ' + cap1(now.text) + '.' : ''}`); }
    recompute(); return true; };
  T.forestTier = () => { const F = D.forest; if (!F) return { index: 0, name: '', next: null }; let index = 0, name = F.none || 'no trees yet', next = F.tiers[0];
    F.tiers.forEach((t, i) => { if (S.trees >= t.at) { index = i + 1; name = t.name; next = F.tiers[i + 1] || null; } });
    const last = F.tiers[F.tiers.length - 1]; if (S.trees >= last.at) { const k = Math.floor(Math.log10(S.trees / last.at)); index = F.tiers.length + k; if (k > 0) name = `${last.name}, ${S.trees} trees`; const na = last.at * Math.pow(10, k + 1); next = { at: na, name: `${last.name}, ${na} trees` }; }
    return { index, name, next }; };
  T.depthOf = sp => { const Y = D.mycelium; return !Y || sp < Y.base ? 0 : Math.floor(Math.log(sp / Y.base) / Math.log(Y.growth)) + 1; };
  T.depthNeed = d => D.mycelium ? D.mycelium.base * Math.pow(D.mycelium.growth, d - 1) : Infinity;
  T.depthName = (d = S.depth) => { const n = D.mycelium.names; return d < n.length ? n[d] : `${n[n.length - 1]}, depth ${d}`; };

  /* ------------------------------------------------------------------ tick */
  function arrive() {
    const cargo = D.ship.cargo * M.cargo, man = S.ship.manifest || norm(S.plan), got = {};
    for (const [k, f] of Object.entries(man)) { const kg = cargo * f; if (kg <= 0) continue;
      if (k === 'crew') { const c = Math.floor(kg / (D.ship.crewMass * M.crewMass)); S.res.crew += c; got.crew = c; }
      else { S.res[k] += kg; got[k] = Math.round(kg); } }
    S.total.ships++;
    const nm = k => (byId(D.resources, k) || { name: k }).name;
    T.log(`${D.ship.name} ${S.ship.n} lands: ` + Object.entries(got).map(([k, v]) => `${v} ${nm(k)}`).join(', ') + '.');
    S.ship = { n: S.ship.n + 1, t: S.ship.t + D.ship.cadence, manifest: null }; emit('ship', got);
  }
  T.step = (dt, quiet) => {
    const s0 = seasonIdx(); S.clock += dt; let dirty = false;
    if (seasonIdx() !== s0) { dirty = true; if (!quiet) T.log(`${T.season().name}.`); }
    const light = T.light(), P = T.power(light), C = T.crew(), calm = T.calm(); flows = {};
    const add = (r, v) => { flows[r] = (flows[r] || 0) + v; };
    for (const [res, q] of Object.entries(D.natural || {})) { const v = q * M.all * rm(res) * calm; S.res[res] += v * dt; S.total[res] = (S.total[res] || 0) + v * dt; add(res, v); }
    if (D.stillness) S.still = Math.min(D.stillness.max, S.still + D.stillness.regen * M.stillness * dt);
    S.sinceAct += dt;
    if (D.forest && S.trees) for (const [res, q] of Object.entries(D.forest.natural || {})) { const v = q * S.trees * M.all * rm(res) * calm; S.res[res] += v * dt; S.total[res] = (S.total[res] || 0) + v * dt; add(res, v); }
    for (const m of D.machines) { const n = S.n[m.id]; if (!n) continue;
      let r = 1; if (m.draw) r *= P.eff; if (m.crew) r *= C.eff * S.morale;
      if (m.solar) r *= light; if (m.night) r *= light < 1 ? 1 : 0;
      if (m.in) { for (const [res, q] of Object.entries(m.in)) { const need = q * n * r * dt; if (need > 0 && S.res[res] < need) r *= Math.max(0, S.res[res] / need); }
        for (const [res, q] of Object.entries(m.in)) { S.res[res] = Math.max(0, S.res[res] - q * n * r * dt); add(res, -q * n * r); } }

        S.res[res] += v * dt; S.total[res] = (S.total[res] || 0) + v * dt; add(res, v); } }
    const crew = S.res.crew;
    if (crew > 0) { let ok = true;
      for (const [res, q] of Object.entries(D.crew.needs)) { const w = q * crew * M.crewWater; if (S.res[res] < w * dt) ok = false;
        S.res[res] = Math.max(0, S.res[res] - w * dt); add(res, -w); }
      const target = ok ? 1 : D.crew.lowMorale; S.morale += Math.sign(target - S.morale) * Math.min(Math.abs(target - S.morale), 0.05 * dt); }
    let lost = 0;
    for (const r of D.resources) { if (r.decay) { const loss = S.res[r.id] * r.decay * M.decay * dt; S.res[r.id] -= loss; lost += loss; add(r.id, -loss / dt); }
      const c = T.cap(r.id); if (S.res[r.id] > c) S.res[r.id] = c; }
    if (D.mycelium) { const Y = D.mycelium; S.spores += Y.perTree * S.trees * dt + (Y.fromDecay ? lost : 0);

      const d = T.depthOf(S.spores); if (d !== S.depth) { S.depth = d; T.log(`The mycelium is ${T.depthName(d)}.`); dirty = true; } }
    S.ship.t -= dt;
    if (!S.ship.manifest && S.ship.t <= D.ship.lock) { S.ship.manifest = norm(S.plan); T.log(`${D.ship.name} ${S.ship.n} has loaded. The order is locked.`); }
    while (S.ship.t <= 0) arrive();
    if (!quiet) { for (const ev of D.events) { if (S.events.some(e => e.id === ev.id)) continue;
        if (Math.random() < ev.p * dt) { S.events.push({ id: ev.id, left: ev.dur }); T.log(`${ev.name}: ${ev.desc}`); dirty = true; } }
      S.events.forEach(e => { e.left -= dt; }); const before = S.events.length; S.events = S.events.filter(e => e.left > 0); if (S.events.length !== before) dirty = true; }
    for (const ms of D.milestones) { if (S.milestones.includes(ms.id)) continue;
      const v = ms.kind === 'total' ? S.total[ms.res] || 0 : ms.kind === 'res' ? S.res[ms.res] : ms.kind === 'research' ? S.research.length : S.sectors.length;
      if (v >= ms.at) { S.milestones.push(ms.id); T.log(ms.text); dirty = true; } }
    if (dirty) recompute();
  };
  T.rates = () => flows;
  T.catchUp = (now = Date.now()) => { const away = Math.min((now - S.saved) / 1e3, D.offlineCap); if (away < 5) return 0;
    const before = S.res[D.primary]; let left = away; while (left > 0) { const d = Math.min(5, left); T.step(d, true); left -= d; }
    S.events = []; recompute(); T.log(`Away ${Math.round(away / 60)} min: +${Math.round(S.res[D.primary] - before)} ${D.primary}.`); return away; };

  /* --------------------------------------------------------------- export
     Assemble the standalone page: play.html with the engine, the definition
     and the UI inlined, so it runs from disk with no extension around it. */
  T.assemble = (files, def, opts = {}) => {
    const stamp = `<!--\n  Exported from the Tideline workshop (tideline/) on ${new Date().toISOString().slice(0, 10)}.\n  Edit tideline/def.json or the Workshop tab and export again; do not edit this file by hand.\n  SCRIPT: yes. It is a game and it counts while you are gone. Marked, like game.html.\n-->`;

      .replace('<!--STAMP-->', stamp)
      .replace('<script src="engine.js"><\/script>', () => '<script>\n' + js(files['engine.js']) + '\n<\/script>')
      .replace('<script src="ui.js"><\/script>', () => '<script id="tick-def" type="application/json">' + JSON.stringify(def).replace(/<\//g, '<\\/') + '<\/script>\n<script>\n' + js(files['ui.js']) + '\n<\/script>')

  };
  root.Tick = T;
})(typeof globalThis !== 'undefined' ? globalThis : window);

lso keeps one saying close, and they stack.","doctrines":[{"id":"water","name":"Like water","desc":"Water ×1.3, creatures need ×0.8.","effects":[{"type":"mul","target":"res:water","x":1.3},{"type":"mul","target":"crewWater","x":0.8}]},{"id":"valley","name":"The low place","desc":"Ground ×1.3.","effects":[{"type":"mul","target":"lift","x":1.3}]},{"id":"block","name":"Uncarved","desc":"Everything ×1.15.","effects":[{"type":"mul","target":"all","x":1.15}]},{"id":"stillness","name":"Stillness","desc":"Stillness returns ×1.4.","effects":[{"type":"mul","target":"stillness","x":1.4}]}]},"becoming":{"note":"The transformation of things. Ring 1 is scripted: blade, flower, acorn, sapling, oak, grove. Then the oak drops an acorn, a tree stands, and the next ring is rolled from templates. There is no last form.","seed":64,"perForm":0.05,"perRing":0.25,"forms":[{"id":"blade","name":"the blade","shape":"blade","text":"nothing extra; it is the game you have","when":{"total":{"grass":1000}}},{"id":"flower","name":"the flower","shape":"flower","text":"bees follow it: creatures arrive ×1.2 per rain","when":{"total":{"grass":20000},"res":{"science":30}},"effects":[{"type":"mul","target":"crewMass","x":0.83}]},{"id":"acorn","name":"the acorn","shape":"acorn","text":"it waits: stillness returns ×1.5, everything ×0.8","when":{"stillDays":200},"effects":[{"type":"mul","target":"stillness","x":1.5},{"type":"mul","target":"all","x":0.8}]},{"id":"sapling","name":"the sapling","shape":"sapling","text":"+500 ground, meadow ×1.3","when":{"total":{"grass":1000000},"n":{"grove":1}},"effects":[{"type":"add","target":"liftBase","x":500},{"type":"mul","target":"machine:meadow","x":1.3}]},{"id":"oak","name":"the oak","shape":"oak","text":"it holds: creatures need ×0.6, the weather reaches you ×0.5","when":{"total":{"grass":100000000},"sectors":6},"effects":[{"type":"mul","target":"crewWater","x":0.6},{"type":"mul","target":"storm","x":0.5}]},{"id":"grove","name":"the grove","shape":"grove","text":"everything ×1.3; the oak's own acorns are ripening","when":{"total":{"grass":1000000000},"sectors":"all"},"effects":[{"type":"mul","target":"all","x":1.3}]}],"generator":{"formsPerRing":6,"names":{"first":["the bent","the wet","the late","the unlit","the low","the patient","the unnamed","the useless","the quiet","the crooked","the small","the last"],"plant":["fern","bramble","lotus","willow","moss","reed","plum","pine","gourd","thistle","lichen","sedge"]},"shapes":["fern","bramble","lotus","willow","tuft","reed","blossom","pine","gourd","thistle","lichen","sedge"],"passives":[{"text":"nothing rots while it stands","effects":[{"type":"mul","target":"decay","x":0.5}]},{"text":"it takes ground and gives it back","effects":[{"type":"mul","target":"lift","x":1.4}]},{"text":"it holds water","effects":[{"type":"mul","target":"cap","x":1.5}]},{"text":"sitting near it is enough","effects":[{"type":"mul","target":"science","x":1.5}]},{"text":"it does not move and you stop moving","effects":[{"type":"mul","target":"stillness","x":1.6}]},{"text":"the creatures do its work for it","effects":[{"type":"mul","target":"crewNeed","x":0.6}]},{"text":"it is pale enough to see by","effects":[{"type":"add","target":"night","x":0.3}]},{"text":"the rains find it","effects":[{"type":"mul","target":"cargo","x":1.3}]},{"text":"the meadow leans toward it","effects":[{"type":"mul","target":"machine:meadow","x":1.5}]},{"text":"it asks for nothing and gets it","effects":[{"type":"mul","target":"all","x":1.2}]}],"threshold":{"base":1000,"perForm":12,"perRing":3},"twist":{"every":3,"stillDays":100,"text":"one form in three also asks for a quiet stretch: 100 days × ring without acting"}}},"forest":{"note":"One tree for every ring closed. Trees are never lost, not even by returning to the root. The reliable part.","perTree":0.02,"tierBonus":0.1,"ground":200,"natural":{"wood":0.01},"none":"no trees yet","tiers":[{"at":1,"name":"a tree"},{"at":3,"name":"a copse"},{"at":10,"name":"a wood"},{"at":30,"name":"a forest"},{"at":100,"name":"the old forest"},{"at":300,"name":"the forest that was here first"},{"at":1000,"name":"the ten thousand trees"}]},"mycelium":{"note":"A tribute to mycelium.html: the web under the forest. Fed by everything that rots and by a tithe of the grass each time the mushrooms fruit. Depth climbs on a log scale, a thousandfold a step, and does not stop.","every":300,"tribute":0.1,"perTree":0.5,"fromDecay":true,"base":1000,"growth":1000,"perLevel":0.1,"names":["nothing yet","threads","a mat","a web under the meadow","the wood wide web","a mind the size of the valley","older than the forest","the thing the forest grows on","depth without a name"]},"avatar":{"note":"The first blade, yours. Nothing on it looks back. Every field is a template: add an option here and it appears in the builder and on the bank.","fields":[{"id":"name","name":"Name","type":"text","default":"The first blade"},{"id":"kind","name":"Kind","type":"choice","options":["meadow grass","reed","bamboo","wheat","sedge","wild oat","foxtail","ryegrass"]},{"id":"height","name":"Height (cm)","type":"range","min":5,"max":200,"default":40},{"id":"width","name":"Blade","type":"choice","options":["fine","narrow","broad","flat"]},{"id":"green","name":"Green","type":"color","options":["#9ad36a","#5fa84a","#3f8a3a","#b8d97a","#7fc98a","#c9d46a","#4f7a4a","#8fb56a"]},{"id":"tip","name":"Tip","type":"color","options":["#e8e0a0","#f2c98a","#c9d46a","#b23a2a","#f0f0f0","#9ad36a"]},{"id":"lean","name":"Lean","type":"choice","options":["upright","leaning","bowed","wind-bent"]},{"id":"head","name":"Seed head","type":"choice","options":["none","wheat ear","foxtail plume","oat panicle","reed plume","seed tuft"]},{"id":"headColor","name":"Head colour","type":"color","options":["#e8d9a0","#c9a06a","#f2c98a","#8a6a44","#d0c0e0","#f0f0f0"]},{"id":"dew","name":"Dew","type":"choice","options":["none","a little","heavy"]},{"id":"clump","name":"Clump","type":"choice","options":["one blade","three","five","a tuft"]},{"id":"mood","name":"Wind","type":"choice","options":["still","swaying","restless"]},{"id":"root","name":"At the root","type":"choice","options":["bare earth","moss","a snail shell","a cowrie","a pearl","a whole lot of shells","a smooth stone"]}]}}</script>
<script>
/* ui.js — the meadow's room. Reads the rules (inline or def.json), keeps the
   save, draws the meadow, and lays the engine's API out as tabs. */
(async function () {
  const $ = s => document.querySelector(s), el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a)) k === 'html' ? e.innerHTML = v : k.startsWith('on') ? e[k] = v : e.setAttribute(k, v); kids.forEach(k => e.append(k)); return e; };
  const isExt = typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local;
  const store = {
    get: async k => isExt ? (await chrome.storage.local.get(k))[k] : (() => { try { return localStorage.getItem(k); } catch (e) { return null; } })(),
    set: async (k, v) => isExt ? chrome.storage.local.set({ [k]: v }) : (() => { try { localStorage.setItem(k, v); } catch (e) {} })(),
    del: async k => isExt ? chrome.storage.local.remove(k) : (() => { try { localStorage.removeItem(k); } catch (e) {} })(),
  };
  const inline = document.getElementById('tick-def');
  const shipped = inline ? JSON.parse(inline.textContent) : await fetch('def.json').then(r => r.json());
  let def = shipped; const ov = await store.get('grass.def'); if (ov) { try { def = JSON.parse(ov); } catch (e) {} }
  Tick.load(def, (await store.get('grass.save')) || null);
  Tick.catchUp();
  let D = Tick.def(), S = Tick.state();

  const fmt = n => { n = +n || 0; const a = Math.abs(n); if (a < 1e3) return a < 10 && n % 1 ? n.toFixed(2) : a < 100 && n % 1 ? n.toFixed(1) : Math.round(n).toString();
    const u = [['k', 1e3], ['M', 1e6], ['B', 1e9], ['T', 1e12]]; for (let i = u.length - 1; i >= 0; i--) if (a >= u[i][1]) return (n / u[i][1]).toFixed(a / u[i][1] < 10 ? 2 : 1) + u[i][0]; return n.toExponential(2); };
  const rname = id => (D.resources.find(r => r.id === id) || { name: id }).name;
  const costStr = c => Object.entries(c).map(([r, v]) => `${fmt(v)} ${rname(r)}`).join(' · ');
  const costCls = c => Tick.can(c) ? 'ok' : 'bad';
  $('#tagline').textContent = D.tagline;

  /* ---------------------------------------------------------------- tabs */
  const TABS = [['bank', 'The meadow'], ['assize', D.ship.name], ['protocols', 'Sayings'], ['reaches', 'Chapters'], ['fork', D.prestige.name], ['you', D.becoming ? 'Your form' : 'Your blade'], ['workshop', 'Workshop'], ['log', 'Log']];
  const panels = {}; let tab = 'bank';
  for (const [id, name] of TABS) { const b = el('button', { onclick: () => show(id) }, name); b.dataset.tab = id; $('#nav').append(b); panels[id] = el('div', { class: 'panel', id: 'p-' + id }); $('#panels').append(panels[id]); }
  function show(id) { tab = id; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id)); Object.entries(panels).forEach(([k, p]) => p.classList.toggle('on', k === id)); build[id] && build[id](); }
  try { const last = localStorage.getItem('grass.tab'); if (last && panels[last]) tab = last; } catch (e) {}

  /* --------------------------------------------------------------- stats */
  const stats = {};
  function statCard(id, label) { const s = el('div', { class: 'stat' }, el('b', {}, label), el('span'), el('i'), el('div', { class: 'bar' }, el('div'))); stats[id] = s; $('#stats').append(s); }
  statCard('primary', rname(D.primary)); if (D.stillness) statCard('still', 'stillness'); statCard('power', D.powerName); statCard('acres', D.lift.name); statCard('crew', D.crew.name); statCard('ship', D.ship.name); statCard('tide', 'the sky');
  if (D.becoming) statCard('form', 'your form'); if (D.forest) statCard('forest', 'the forest'); if (D.mycelium) statCard('myc', 'the mycelium');
  const setStat = (id, v, i, bar, warn) => { const s = stats[id]; s.children[1].textContent = v; s.children[2].textContent = i || ''; const b = s.children[3].firstChild; if (bar == null) s.children[3].style.display = 'none'; else { s.children[3].style.display = ''; b.style.width = Math.min(100, bar * 100) + '%'; b.classList.toggle('warn', !!warn); } };

  /* ----------------------------------------------------------------- bank */
  let mult = 1, sig = '';
  const signature = () => S.sectors.join() + '|' + S.research.join() + '|' + Object.keys(Tick.mods().unlock).join() + '|' + S.playstyle + '|' + S.refloats + '|' + S.ring + ':' + S.form;
  const build = {};
  build.bank = () => {
    const p = panels.bank; p.innerHTML = '';
    p.append(el('button', { id: 'tap', class: 'act', onclick: () => { Tick.tap(); refresh(); } }, tapLabel()));
    const seg = el('div', { class: 'row' }, el('span', { style: 'color:var(--dim)' }, 'let'), el('div', { class: 'seg' }, ...[1, 10, 'max'].map(k => el('button', { class: k === mult ? 'on' : '', onclick: () => { mult = k; build.bank(); } }, '×' + k))));
    p.append(seg);
    for (const s of D.sectors) { if (!S.sectors.includes(s.id)) continue;
      const ms = D.machines.filter(m => m.sector === s.id && Tick.available(m)); if (!ms.length) continue;
      const sec = el('section', {}, el('h2', {}, s.name, el('i', {}, s.role)));
      for (const m of ms) { const b = el('button', { class: 'act m', onclick: () => { Tick.buy(m.id, mult); refresh(); } }, el('b', {}, m.name), el('span', { class: 'n' }), el('i', {}, m.desc + ' ', el('span', { class: 'r' }), el('br'), el('span', { class: 'cost' }))); b.dataset.m = m.id; sec.append(b); }
      p.append(sec); }
    if (!S.playstyle && D.playstyles) p.append(playstyleModal());
    sig = signature();
  };
  function playstyleModal() {
    const m = el('div', { class: 'modal' }, el('div', {}, el('h2', {}, 'Who stays as your guest?'), el('p', {}, 'A guest is a template: a set of multipliers and a few things only they know how to let happen. You choose one at the first blade and again at every return.'),
      el('div', { class: 'grid' }, ...D.playstyles.map(ps => el('div', { class: 'card' }, el('h3', {}, ps.name), el('p', {}, ps.desc), el('button', { class: 'act', onclick: () => { Tick.setPlaystyle(ps.id); build.bank(); } }, 'Take it'))))));
    return m;
  }
  function refreshBank() { const M = Tick.mods(), L = Tick.lift();
    for (const b of panels.bank.querySelectorAll('.m')) { const m = D.machines.find(x => x.id === b.dataset.m); let k = mult === 'max' ? Math.max(1, Tick.maxBuy(m)) : mult; const c = Tick.cost(m, k);
      b.children[1].textContent = S.n[m.id]; const r = b.querySelector('.r'), cs = b.querySelector('.cost');
      const outs = Object.entries(m.out || {}).map(([res, q]) => `${fmt(q * (M.machine[m.id] || 1) * M.all * (res === 'power' ? 1 : (M.res[res] || 1) * Tick.calm()))} ${res === 'power' ? D.powerName : rname(res)}/s`);
      const ins = Object.entries(m.in || {}).map(([res, q]) => `−${fmt(q)} ${rname(res)}/s`);
      r.textContent = [...outs, ...ins, m.lift ? `+${fmt(m.lift * M.lift)} ${D.lift.name}` : '', m.draw ? `${fmt(m.draw * M.draw)} ${D.powerName}` : '', m.crew ? `${fmt(m.crew * M.crewNeed)} ${D.crew.name}` : '', m.mass ? `${m.mass} ${D.lift.name}` : ''].filter(Boolean).join(' · ');
      const room = L.used + (m.mass || 0) * k <= L.cap; cs.textContent = `×${k}: ${costStr(c)}` + (room ? '' : ` · no ${D.lift.name}`); cs.className = 'cost ' + (Tick.can(c) && room ? 'ok' : 'bad'); b.disabled = !(Tick.can(c) && room); }
    const t = $('#tap'); if (t) t.textContent = tapLabel(); }
  const tapLabel = () => { const M = Tick.mods(); return `Act · +${fmt(D.tap * M.tap * M.all)} ${rname(D.primary)}` + (D.stillness ? ` · costs ${D.stillness.tapCost} stillness` : ''); };

  /* --------------------------------------------------------------- assize */
  build.assize = () => { const p = panels.assize; p.innerHTML = '';
    p.append(el('section', {}, el('h2', {}, D.ship.name), el('p', { style: 'color:var(--dim);margin:0 0 8px' }, D.ship.note), el('div', { id: 'ship-status' })));
    const sec = el('section', {}, el('h2', {}, 'The order', el('i', {}, `what ${fmt(D.ship.cargo)} kg of hold carries`)));
    for (const k of Object.keys(D.ship.plan)) { const inp = el('input', { type: 'range', min: 0, max: 100, step: 1, value: Math.round((S.plan[k] || 0) * 100) }); inp.dataset.k = k;
      inp.oninput = () => { const plan = {}; for (const i of sec.querySelectorAll('input')) plan[i.dataset.k] = +i.value; Tick.setPlan(plan); refreshAssize(); };
      sec.append(el('label', { class: 'f' }, rname(k), inp, el('output'))); }
    p.append(sec);
    p.append(el('section', {}, el('h2', {}, 'Landed'), el('ul', { id: 'ship-log', style: 'margin:0;padding:0' })));
    refreshAssize(); };
  function refreshAssize() { if (tab !== 'assize') return; const M = Tick.mods(), cargo = D.ship.cargo * M.cargo, st = $('#ship-status'); if (!st) return;
    const locked = !!S.ship.manifest, t = S.ship.t;
    st.innerHTML = `<div class="badge ${locked ? 'hot' : ''}">${D.ship.name} ${S.ship.n}</div> <div class="badge">lands in ${Math.ceil(t)} d</div> <div class="badge">${locked ? 'loaded, order locked' : 'loads in ' + Math.ceil(t - D.ship.lock) + ' d, order open'}</div> <div class="badge">hold ${fmt(cargo)} kg</div>`;
    const man = S.ship.manifest || S.plan;
    for (const i of panels.assize.querySelectorAll('input[type=range]')) { const k = i.dataset.k, f = man[k] || 0, kg = cargo * f; i.disabled = false;
      i.nextElementSibling.textContent = k === 'crew' ? `${Math.floor(kg / (D.ship.crewMass * M.crewMass))} seats` : `${fmt(kg)} ${rname(k)}`; }
    const ul = $('#ship-log'); ul.innerHTML = S.log.filter(l => l.m.startsWith(D.ship.name)).slice(0, 8).map(l => `<li><b>d${l.t}</b>${l.m}</li>`).join(''); ul.id = 'ship-log'; ul.classList.add('loglist'); }

  /* ------------------------------------------------------------ protocols */
  build.protocols = () => { const p = panels.protocols; p.innerHTML = ''; const g = el('div', { class: 'grid' });
    for (const r of D.research) { const done = S.research.includes(r.id), needs = (r.needs || []).filter(x => !S.research.includes(x)), shut = (r.excludes || []).some(x => S.research.includes(x));
      const c = el('div', { class: 'card' + (done ? ' done' : '') }, el('h3', {}, r.name), el('p', {}, r.desc), needs.length ? el('p', {}, 'needs ' + needs.map(x => D.research.find(y => y.id === x).name).join(', ')) : '',
        r.excludes ? el('p', {}, (shut ? 'closed by ' : 'closes ') + r.excludes.map(x => D.research.find(y => y.id === x).name).join(', ')) : '',
        el('button', { class: 'act', disabled: done || needs.length || shut ? true : undefined, onclick: () => { Tick.research(r.id); refresh(); } }, done ? 'known' : shut ? 'closed' : `${fmt(Tick.researchCost(r))} ${rname('science')}`)); c.dataset.r = r.id; g.append(c); }
    p.append(el('section', {}, el('h2', {}, 'Sayings', el('i', {}, `bought with ${rname('science')}; the quiet pool makes it`)), g)); };
  function refreshProtocols() { for (const c of panels.protocols.querySelectorAll('.card')) { const r = D.research.find(x => x.id === c.dataset.r); const b = c.querySelector('button'); if (S.research.includes(r.id)) continue; const needs = (r.needs || []).some(x => !S.research.includes(x)) || (r.excludes || []).some(x => S.research.includes(x)); b.disabled = needs || S.res.science < Tick.researchCost(r); } }

  /* -------------------------------------------------------------- reaches */
  build.reaches = () => { const p = panels.reaches; p.innerHTML = ''; const g = el('div', { class: 'grid' });
    for (const s of D.sectors) { const built = S.sectors.includes(s.id); const cost = { ...(s.cost || {}) }; const crew = cost.crew || 0; delete cost.crew;
      const c = el('div', { class: 'card' + (built ? ' done' : '') }, el('h3', {}, s.name, ' ', el('span', { class: 'badge' }, s.role)), el('p', {}, s.desc),
        s.needs ? el('p', {}, 'after ' + s.needs.map(x => D.sectors.find(y => y.id === x).name).join(' and ')) : '',
        s.effects ? el('p', {}, s.effects.map(e => `${e.target} ×${e.x}`).join(', ')) : '',
        built ? el('span', { class: 'badge hot' }, 'reached') : el('button', { class: 'act', onclick: () => { Tick.build(s.id); refresh(); } }, `${costStr(cost)}${crew ? ' · ' + crew + ' ' + D.crew.name : ''}`));
      c.dataset.s = s.id; g.append(c); }
    p.append(el('section', {}, el('h2', {}, 'Twelve chapters', el('i', {}, 'in the order they have to be reached in')), g)); };
  function refreshReaches() { for (const c of panels.reaches.querySelectorAll('.card')) { const s = D.sectors.find(x => x.id === c.dataset.s); const b = c.querySelector('button'); if (!b) continue; const cost = { ...(s.cost || {}) }; const crew = cost.crew || 0; delete cost.crew; b.disabled = !(Tick.sectorOk(s) && Tick.can(cost) && S.res.crew >= crew); } }

  /* ----------------------------------------------------------------- fork */
  build.fork = () => { const p = panels.fork; p.innerHTML = ''; const P = D.prestige;

    g.fillStyle = day ? '#274f3b' : '#0e1f19'; for (let i = 0; i < 14; i++) { const x = W - i * (W / 12) - 30, h = 40 + (i * 37 % 30); g.beginPath(); g.moveTo(x - 18, H * .62); g.lineTo(x, H * .62 - h); g.lineTo(x + 18, H * .62); g.fill(); }
    const tide = day ? 1 : .6, wy = H * (.72 - .06 * tide); const water = g.createLinearGradient(0, wy, 0, H); water.addColorStop(0, day ? '#3f8fbf' : '#1a3550'); water.addColorStop(1, day ? '#1f4a6e' : '#0b1a2a'); g.fillStyle = water; g.fillRect(0, wy, W, H - wy);
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1; for (let i = 0; i < 5; i++) { g.beginPath(); const y = wy + 10 + i * 14; for (let x = 0; x <= W; x += 8) g.lineTo(x, y + Math.sin(x / 22 + t / 600 + i) * 2); g.stroke(); }
    g.fillStyle = day ? '#5a4a34' : '#241e16'; g.fillRect(0, wy - 8, W * .42, 8); g.fillStyle = day ? '#3a5a3a' : '#152215'; g.fillRect(0, H * .62, W, wy - 8 - H * .62);
    const S0 = Tick.state(); const n = id => S0.n[id] || 0;
    const prod = D.machines.filter(m => m.out && m.out[D.primary]).reduce((a, m) => a + n(m.id), 0), suns = D.machines.filter(m => m.out && m.out.power && m.solar).reduce((a, m) => a + n(m.id), 0);
    const tufts = Math.min(70, 1 + Math.round(Math.log2(1 + prod + S0.res[D.primary] / 200) * 7)); g.strokeStyle = day ? '#9ad36a' : '#3f6b34'; g.lineWidth = 2;
    for (let i = 0; i < tufts; i++) { const x = 10 + (i * 137 % Math.max(1, W * .42)), y = H * .63 + (i * 53 % Math.max(1, wy - 14 - H * .63)), sw = Math.sin(t / 700 + i) * 3; for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + k * 4 + sw, y - 10 - (k === 0 ? 4 : 0)); g.stroke(); } }
    for (let i = 0; i < Math.min(8, suns); i++) { const x = W * .46 + i * 22, y = H * .62 + 8; g.fillStyle = day ? '#ffd86a' : '#6a5a3a'; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.strokeStyle = day ? '#ffe9a8' : '#4a4a3a'; g.lineWidth = 1; for (let k = 0; k < 8; k++) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(k + t / 900) * 9, y + Math.sin(k + t / 900) * 9); g.stroke(); } }
    S0.sectors.forEach((id, i) => { const k = D.sectors.findIndex(s => s.id === id), x = 20 + k * (W / 13); g.fillStyle = day ? '#6b5a44' : '#2a2420'; g.fillRect(x, H * .62 - 16, 18, 16); g.fillStyle = Tick.power().eff < 1 && Math.sin(t / 60 + k) > .3 ? '#333' : '#ffd68a'; g.fillRect(x + 6, H * .62 - 11, 5, 6); });
    const rate = Tick.rates()[D.primary] || 0; if (Math.random() < Math.min(1, rate / 40 + .05)) motes.push({ x: Math.random() * W * .4, y: wy + 5 + Math.random() * 20, v: .3 + Math.random() * .6, life: 1 });
    g.fillStyle = '#f2c98a'; for (const m of motes) { m.y -= m.v; m.life -= .012; g.globalAlpha = Math.max(0, m.life); g.beginPath(); g.arc(m.x, m.y, 2, 0, 7); g.fill(); } g.globalAlpha = 1; for (let i = motes.length - 1; i >= 0; i--) if (motes[i].life <= 0) motes.splice(i, 1);
    if (S0.ship.t < 60) { const f = 1 - S0.ship.t / 60, bx = W + 80 - f * (W * .7), by = 34; g.fillStyle = 'rgba(120,130,150,.85)'; for (const [dx, r] of [[-30, 16], [0, 22], [28, 15], [-8, 18]]) { g.beginPath(); g.arc(bx + dx, by, r, 0, 7); g.fill(); } g.strokeStyle = 'rgba(156,198,232,.5)'; g.lineWidth = 1; for (let i = 0; i < 8; i++) { g.beginPath(); g.moveTo(bx - 30 + i * 9, by + 18); g.lineTo(bx - 33 + i * 9, by + 30 + (t / 5 + i * 7) % 12); g.stroke(); } }
    if (flash > 0) { g.fillStyle = `rgba(242,201,138,${flash * .5})`; g.fillRect(0, 0, W, H); flash -= .02; }
    for (const e of S0.events) { const d = D.events.find(x => x.id === e.id); const col = d.color || '#ffffff';
      if (d.fx === 'rain') { g.strokeStyle = col; g.globalAlpha = .4; g.lineWidth = 1; for (let i = 0; i < 40; i++) { const x = (i * 97 + t / 4) % W, y = (i * 53 + t / 3) % H; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y + 10); g.stroke(); } g.globalAlpha = 1; }
      if (d.fx === 'sparks') { g.fillStyle = col; for (let i = 0; i < 14; i++) { const x = (i * 83 + t / 9) % W, y = H - ((i * 41 + t / 6) % H); g.fillRect(x, y, 3, 3); } }
      if (d.fx === 'gold') { g.fillStyle = col; g.globalAlpha = .12 + Math.sin(t / 200) * .05; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
      if (d.fx === 'shadow') { g.fillStyle = col; g.globalAlpha = .45; g.fillRect(0, 0, W, H); g.globalAlpha = 1; const dx = (t / 8) % (W + 300) - 150, fl = Math.sin(t / 150) * 10; g.fillStyle = 'rgba(0,0,0,.6)'; g.beginPath(); g.ellipse(dx, 40, 90, 14, 0, 0, 7); g.fill(); g.beginPath(); g.moveTo(dx - 60, 40); g.lineTo(dx - 120, 20 + fl); g.lineTo(dx - 50, 46); g.moveTo(dx + 60, 40); g.lineTo(dx + 120, 20 + fl); g.lineTo(dx + 50, 46); g.fill(); }
      g.fillStyle = 'rgba(239,233,220,.9)'; g.font = '12px system-ui'; g.textAlign = 'right'; g.fillText(d.name + ' · ' + Math.ceil(e.left) + 'd', W - 10, 18 + 16 * S0.events.indexOf(e)); }
    drawForest(g, W, H, wy, S0, day);
    drawForm(g, W * .45, wy - 10, .55, S0, t);
    if (tab === 'you') drawYou(t);
    g.fillStyle = 'rgba(239,233,220,.7)'; g.font = '11px system-ui'; g.textAlign = 'left'; g.fillText(`${day ? D.day.dayName : D.day.nightName} · light ${Math.round(light * 100)}% · ${S0.sectors.length}/${D.sectors.length} chapters · stillness ${Math.round(S0.still || 0)}`, 10, 16);
    requestAnimationFrame(scene); }

  /* the form, the forest, the mushrooms. Silhouettes only; nothing here has eyes. */
  function drawForm(g, x, y, s, S0, t) { const fd = D.becoming ? Tick.formDef(S0.ring, S0.form) : null, shape = fd ? fd.shape : 'blade', a = S0.avatar, green = a.green || '#9ad36a', ring = S0.ring || 1;
    const H = s * (10 + (+a.height || 40) * 1.1), wig = Math.sin(t / 900) * 2 * s;
    const tree = (h, w, canopy) => { g.fillStyle = '#5a3d24'; g.fillRect(x - w / 2, y - h, w, h); g.fillStyle = green; for (const [dx, dy, r] of canopy) { g.beginPath(); g.ellipse(x + dx * s + wig * .3, y - h - dy * s, r * s, r * s * .8, 0, 0, 7); g.fill(); } };
    const label = () => { g.fillStyle = 'rgba(239,233,220,.85)'; g.font = `${11 * s / 1.6}px system-ui`; g.textAlign = 'center'; g.fillText(a.name || '', x, y + 16 * s); };
    if (['blade', 'fern', 'tuft', 'reed', 'sedge'].includes(shape)) { drawBlade(g, x, y, s, shape === 'blade' ? a : { ...a, clump: shape === 'tuft' ? 'a tuft' : 'three', head: shape === 'reed' ? 'reed plume' : a.head }, t); return; }
    if (['flower', 'blossom', 'lotus', 'thistle'].includes(shape)) { drawBlade(g, x, y, s, { ...a, head: 'none', clump: 'one blade' }, t); const n = shape === 'thistle' ? 14 : shape === 'lotus' ? 8 : 6, col = a.headColor || '#e8d9a0', tx = x + wig, ty = y - H;
      g.fillStyle = col; for (let i = 0; i < n; i++) { const an = i / n * Math.PI * 2 + t / 4000; g.beginPath(); g.ellipse(tx + Math.cos(an) * 6 * s, ty + Math.sin(an) * 6 * s, 4.5 * s, 2.2 * s, an, 0, 7); g.fill(); }
      g.fillStyle = a.tip || '#f2c98a'; g.beginPath(); g.arc(tx, ty, 3 * s, 0, 7); g.fill(); return; }
    if (['acorn', 'gourd', 'lichen', 'bramble'].includes(shape)) { g.fillStyle = shape === 'gourd' ? '#c9a227' : shape === 'lichen' ? '#8fb56a' : '#b98c5a'; g.beginPath(); g.ellipse(x, y - 8 * s, 7 * s, 9 * s, 0, 0, 7); g.fill();
      if (shape === 'acorn' || shape === 'bramble') { g.fillStyle = '#6b4a2a'; g.beginPath(); g.ellipse(x, y - 14 * s, 8 * s, 4 * s, 0, 0, 7); g.fill(); g.fillRect(x - s, y - 20 * s, 2 * s, 6 * s); } label(); return; }
    if (['sapling', 'willow', 'pine'].includes(shape)) { tree((30 + 6 * Math.min(ring, 8)) * s, 3 * s, shape === 'pine' ? [[0, 12, 9], [0, 4, 12], [0, -4, 15]] : [[0, 6, 12], [-6, 0, 8], [6, 0, 8]]); label(); return; }
    if (shape === 'oak') { tree((50 + 6 * Math.min(ring, 10)) * s, 8 * s, [[0, 14, 26], [-18, 4, 16], [18, 4, 16], [-8, 24, 12], [8, 24, 12]]); label(); return; }
    if (shape === 'grove') { const ox = x; for (const dx of [-26, 0, 26]) { x = ox + dx * s; tree((40 + 5 * Math.min(ring, 10)) * s, 5 * s, [[0, 10, 18], [-10, 2, 12], [10, 2, 12]]); } x = ox; label(); return; }
    drawBlade(g, x, y, s, a, t); }
  function drawForest(g, W, H, wy, S0, day) { const trees = S0.trees || 0, depth = S0.depth || 0;
    for (let i = 0; i < Math.min(40, trees); i++) { const tx = W * .56 + (i * 41 % Math.max(1, W * .42)), th = 18 + (i * 13 % 16), ty = H * .62 + 4 + (i * 7 % 10); g.fillStyle = day ? '#4a3220' : '#1e150c'; g.fillRect(tx - 1.5, ty - th, 3, th); g.fillStyle = day ? '#3f8a3a' : '#173a1a'; g.beginPath(); g.ellipse(tx, ty - th, 9, 8, 0, 0, 7); g.fill(); }
    if (trees > 40) { g.fillStyle = 'rgba(239,233,220,.7)'; g.font = '10px system-ui'; g.textAlign = 'right'; g.fillText(`${trees} trees`, W - 10, H * .62 - 4); }
    for (let i = 0; i < Math.min(30, depth * 3); i++) { const mx = 12 + (i * 53 % Math.max(1, W * .4)), my = wy - 4 - (i * 29 % Math.max(1, wy - 8 - H * .63)); g.fillStyle = '#e8e0d0'; g.fillRect(mx - 1, my - 5, 2, 5); g.fillStyle = i % 3 ? '#c9583a' : '#e8c070'; g.beginPath(); g.ellipse(mx, my - 5, 4, 2.5, 0, Math.PI, 0); g.fill(); } }

  /* ----------------------------------------------------------------- loop */
  let last = performance.now();
  setInterval(() => { const now = performance.now(); Tick.step(Math.min(1, (now - last) / 1e3)); last = now; refresh(); }, 100);
  setInterval(() => store.set('grass.save', Tick.serialize()), 5000);
  addEventListener('beforeunload', () => { try { localStorage.setItem('grass.tab', tab); } catch (e) {} if (!isExt) { try { localStorage.setItem('grass.save', Tick.serialize()); } catch (e) {} } });
  show(tab); refresh(true); requestAnimationFrame(scene);
})();
