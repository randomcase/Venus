<title>The First Blade · one blade of grass, then everything</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--STAMP-->
<!--
  THE FIRST BLADE — an idle game with the Tao in mind. One blade of grass
  grows by itself. Everything you let happen compounds; everything you DO
  spends stillness, and the meadow grows slower for it. Wu wei, as a loop.

  The page works three ways from the same files:
    · as a Chromium side panel (manifest.json points here)
    · as a tab inside the extension (Workshop → open in a tab)
    · exported flat, engine + rules + UI inlined, as grass.html in the yard
  The rules are def.json. The engine is engine.js. This file is only the room.
  The same def.json drives the ScalaFX edition in desktop/.
-->
<style>
  :root{--void:#0b0d12;--panel:#151922;--panel2:#1c2230;--edge:#2b3445;--ink:#efe9dc;--dim:#95a0b3;
    --shell:#f2c98a;--silver:#cfd8e6;--ok:#6fd4a8;--bad:#e06f5a;--tide:#3f8fbf;--forest:#3d7a52;--accent:#e7a26b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--void);color:var(--ink);font:13px/1.45 ui-rounded,system-ui,-apple-system,sans-serif}
  body{display:grid;grid-template-rows:auto auto auto 1fr;min-height:100vh}
  header{display:flex;align-items:baseline;gap:10px;padding:10px 12px 6px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;color:var(--shell);font-weight:600;letter-spacing:.02em}
  header small{color:var(--dim)}
  header .sp{flex:1}
  nav{display:flex;gap:4px;padding:0 8px 6px;overflow-x:auto;scrollbar-width:none}
  nav button{white-space:nowrap;background:transparent;border:1px solid transparent;color:var(--dim);border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
  nav button.on{background:var(--panel2);border-color:var(--edge);color:var(--ink)}
  nav button b{color:var(--accent);font-weight:600;margin-left:4px}
  #scene{display:block;width:100%;height:170px;background:#0a1a2a}
  main{padding:8px 10px 24px;max-width:960px;width:100%;margin:0 auto}
  .panel{display:none}.panel.on{display:block}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-bottom:10px}
  .stat{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;min-width:0}
  .stat b{display:block;font-size:11px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
  .stat span{font-size:17px;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;color:var(--dim);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{height:5px;background:var(--panel2);border-radius:3px;margin-top:5px;overflow:hidden}
  .bar div{height:100%;background:var(--tide);width:0;transition:width .3s}
  .bar div.warn{background:var(--bad)}
  .resline{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;color:var(--dim);font-size:12px}
  .resline span{font-variant-numeric:tabular-nums}
  .resline b{color:var(--ink);font-weight:500}
  button.act{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
  button.act:hover:not(:disabled){border-color:var(--accent)}
  button.act:disabled{opacity:.42;cursor:not-allowed}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .row .act{flex:1;text-align:center}
  #tap{background:#2a2036;border-color:var(--shell);font-size:16px;padding:14px;text-align:center;width:100%}
  #tap:active{transform:scale(.985)}
  section{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:10px;margin:8px 0}
  section h2{margin:0 0 6px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  section h2 i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
  .m{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;margin:4px 0}
  .m b{font-weight:600}
  .m i{font-style:normal;color:var(--dim);font-size:11.5px;line-height:1.35}
  .m .n{grid-row:span 2;font-size:20px;color:var(--tide);font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
  .m .n.gold{color:var(--shell);font-size:14px}
  .cost{color:var(--shell)}.ok{color:var(--ok)}.bad{color:var(--bad)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
  .card{background:var(--panel2);border:1px solid var(--edge);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
  .card.done{border-color:var(--ok)}
  .card h3{margin:0;font-size:13px;font-weight:600}
  .card p{margin:0;color:var(--dim);font-size:11.5px}
  .card .act{margin-top:auto;text-align:center}
  .seg{display:inline-flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
  .seg button{font:inherit;background:transparent;color:var(--dim);border:0;padding:5px 10px;cursor:pointer}
  .seg button.on{background:var(--panel2);color:var(--ink)}
  input[type=range]{width:100%;accent-color:var(--tide)}
  label.f{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;margin:4px 0;font-size:12px;color:var(--dim)}
  label.f output{font-variant-numeric:tabular-nums;color:var(--ink);min-width:60px;text-align:right}
  select,input[type=text]{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:5px 8px;width:100%}
  .sw{display:flex;gap:5px;flex-wrap:wrap}
  .sw button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .sw button.on{border-color:var(--ink)}
  textarea{width:100%;min-height:280px;font:11.5px/1.4 ui-monospace,Consolas,monospace;background:#0e1118;color:var(--ink);border:1px solid var(--edge);border-radius:10px;padding:8px;resize:vertical;tab-size:2}
  #log li{list-style:none;padding:4px 0;border-bottom:1px solid var(--edge);color:var(--dim)}
  #log li b{color:var(--ink);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
  #log{margin:0;padding:0}
  .modal{position:fixed;inset:0;background:rgba(5,8,14,.86);display:grid;place-items:center;padding:16px;z-index:9}
  .modal>div{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:16px;max-width:520px;width:100%}
  .modal h2{margin:0 0 4px;color:var(--shell)}
  .modal p{color:var(--dim);margin:0 0 10px}
  .badge{display:inline-block;background:var(--panel2);border:1px solid var(--edge);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--dim);margin:2px 2px 0 0}
  .badge.hot{border-color:var(--accent);color:var(--accent)}
  code{font:11.5px ui-monospace,Consolas,monospace;color:var(--silver)}
  footer.yard{padding:14px 12px;color:var(--dim);font-size:12px;text-align:center}
  footer.yard a{color:var(--tide);text-decoration:none}
  .avatar-wrap{display:grid;grid-template-columns:200px 1fr;gap:10px}
  @media (max-width:560px){.avatar-wrap{grid-template-columns:1fr}}
  #you-canvas{width:100%;height:280px;background:#0a1a2a;border-radius:10px;border:1px solid var(--edge)}
</style>
<header>
  <h1>The First Blade</h1><small id="tagline"></small><span class="sp"></span>
  <small id="clock"></small>
</header>
<nav id="nav"></nav>
<canvas id="scene" width="960" height="170"></canvas>
<main>
  <div class="stats" id="stats"></div>
  <div class="resline" id="resline"></div>
  <div id="panels"></div>
</main>
